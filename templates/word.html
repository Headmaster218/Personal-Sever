<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>背单词</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #1f2937;
      background: #f5f7fb;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px;
    }

    .topbar,
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1,
    h2 {
      margin: 0;
    }

    h1 {
      font-size: 30px;
    }

    h2 {
      font-size: 20px;
    }

    .home-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .period-form {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      color: #64748b;
      font-size: 14px;
    }

    select,
    input[type="date"] {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #1f2937;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card,
    .panel,
    .entry {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    .stat-card {
      padding: 16px;
    }

    .stat-card p {
      margin: 0 0 8px;
      color: #64748b;
      font-size: 14px;
    }

    .stat-card strong {
      font-size: 30px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
    }

    .panel {
      position: relative;
      padding: 18px;
    }

    .chart-wrap {
      position: relative;
    }

    canvas {
      width: 100%;
      height: 340px;
    }

    .tooltip {
      position: absolute;
      display: none;
      padding: 7px 9px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      font-size: 13px;
      pointer-events: none;
      white-space: nowrap;
      transform: translate(-50%, -120%);
    }

    .entries {
      display: grid;
      gap: 12px;
    }

    .entry {
      display: block;
      padding: 16px;
      text-decoration: none;
      color: inherit;
    }

    .entry:hover {
      border-color: #93c5fd;
    }

    .entry strong {
      display: block;
      margin-bottom: 6px;
      font-size: 18px;
    }

    .entry span,
    .legend {
      color: #64748b;
      font-size: 14px;
    }

    .legend {
      display: flex;
      gap: 14px;
      margin-bottom: 8px;
    }

    .range {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 6px;
      border-radius: 50%;
    }

    .green {
      background: #22c55e;
    }

    .red {
      background: #ef4444;
    }

    @media (max-width: 860px) {
      .stats,
      .layout {
        grid-template-columns: 1fr;
      }

      .topbar,
      .panel-head {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="topbar">
      <h1>背单词主页</h1>
      <a class="home-link" href="/Home">前往主页</a>
    </div>

    <section class="stats">
      <div class="stat-card">
        <p>本周期浏览单词</p>
        <strong>{{ stats.unique_count }}</strong>
      </div>
      <div class="stat-card">
        <p>本周期分类次数</p>
        <strong>{{ stats.event_count }}</strong>
      </div>
      <div class="stat-card">
        <p>本周期会的单词</p>
        <strong>{{ stats.known_count }}</strong>
      </div>
      <div class="stat-card">
        <p>本周期不会的单词</p>
        <strong>{{ stats.unknown_count }}</strong>
      </div>
    </section>

    <section class="layout">
      <div class="panel">
        <div class="panel-head">
          <h2>筛选记录</h2>
          <form class="period-form" method="get" action="/word">
            <label for="period">周期</label>
            <select id="period" name="period" onchange="this.form.submit()">
              {% for option in stats.period_options %}
              <option value="{{ option.value }}" {% if option.value == stats.period %}selected{% endif %}>{{ option.label }}</option>
              {% endfor %}
            </select>
            <label id="anchorLabel" for="anchorDate">日期</label>
            <input id="anchorDate" type="date" name="anchor_date" value="{{ stats.anchor_date }}" onchange="this.form.submit()">
          </form>
        </div>
        <div class="range">当前范围：{{ stats.range_label }}</div>
        <div class="legend">
          <span><i class="dot green"></i>会</span>
          <span><i class="dot red"></i>不会</span>
        </div>
        <div class="chart-wrap">
          <canvas id="dailyChart" width="760" height="340"></canvas>
          <div id="chartTooltip" class="tooltip"></div>
        </div>
      </div>

      <div class="entries">
        <a class="entry" href="/word/sort">
          <strong>筛选文章单词</strong>
          <span>从托福文章或自定义文本里筛出新词。</span>
        </a>
        <a class="entry" href="/word/list">
          <strong>单词表</strong>
          <span>查看已经标记为会和不会的单词。</span>
        </a>
        <a class="entry" href="/word/review">
          <strong>背单词</strong>
          <span>复习流程后面接着做。</span>
        </a>
      </div>
    </section>
  </main>

  <script>
    const dailyData = {{ stats.daily | tojson }};
    const canvas = document.getElementById('dailyChart');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('chartTooltip');
    const periodSelect = document.getElementById('period');
    const anchorDate = document.getElementById('anchorDate');
    const anchorLabel = document.getElementById('anchorLabel');
    let hoverTargets = [];

    function updateAnchorVisibility() {
      const hidden = periodSelect.value === 'all';
      anchorDate.style.display = hidden ? 'none' : 'inline-block';
      anchorLabel.style.display = hidden ? 'none' : 'inline-block';
    }

    function niceMax(value) {
      if (value <= 5) return 5;
      const magnitude = Math.pow(10, Math.floor(Math.log10(value)));
      return Math.ceil(value / magnitude) * magnitude;
    }

    function drawChart() {
      const width = canvas.width;
      const height = canvas.height;
      const paddingLeft = 48;
      const paddingRight = 16;
      const paddingTop = 24;
      const paddingBottom = 42;
      const chartHeight = height - paddingTop - paddingBottom;
      const chartWidth = width - paddingLeft - paddingRight;
      const maxValue = niceMax(Math.max(1, ...dailyData.map(item => item.known + item.unknown)));
      const groupWidth = chartWidth / Math.max(1, dailyData.length);
      const barWidth = Math.max(4, Math.min(18, groupWidth / 3));
      const baseY = height - paddingBottom;
      hoverTargets = [];

      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = '#dbe3ef';
      ctx.fillStyle = '#64748b';
      ctx.font = '12px Arial';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';

      for (let tick = 0; tick <= 5; tick += 1) {
        const value = Math.round(maxValue / 5 * tick);
        const y = baseY - value / maxValue * chartHeight;
        ctx.beginPath();
        ctx.moveTo(paddingLeft, y);
        ctx.lineTo(width - paddingRight, y);
        ctx.stroke();
        ctx.fillText(value, paddingLeft - 8, y);
      }

      ctx.strokeStyle = '#94a3b8';
      ctx.beginPath();
      ctx.moveTo(paddingLeft, paddingTop);
      ctx.lineTo(paddingLeft, baseY);
      ctx.lineTo(width - paddingRight, baseY);
      ctx.stroke();

      dailyData.forEach((item, index) => {
        const x = paddingLeft + index * groupWidth + groupWidth / 2;
        const bars = [
          { key: 'known', label: '会', value: item.known, color: '#22c55e', x: x - barWidth - 2 },
          { key: 'unknown', label: '不会', value: item.unknown, color: '#ef4444', x: x + 2 },
        ];

        bars.forEach(bar => {
          const barHeight = bar.value / maxValue * chartHeight;
          const y = baseY - barHeight;
          ctx.fillStyle = bar.color;
          ctx.fillRect(bar.x, y, barWidth, barHeight);
          hoverTargets.push({
            x: bar.x,
            y: y,
            width: barWidth,
            height: Math.max(2, barHeight),
            date: item.date,
            label: bar.label,
            value: bar.value,
          });
        });

        if (dailyData.length <= 31 || index % Math.ceil(dailyData.length / 12) === 0) {
          ctx.fillStyle = '#64748b';
          ctx.font = '11px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillText(item.date.slice(5), x, baseY + 10);
        }
      });
    }

    function showTooltip(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (event.clientX - rect.left) * scaleX;
      const y = (event.clientY - rect.top) * scaleY;
      const target = hoverTargets.find(item =>
        x >= item.x && x <= item.x + item.width &&
        y >= item.y && y <= item.y + item.height
      );

      if (!target) {
        tooltip.style.display = 'none';
        return;
      }

      tooltip.textContent = `${target.date} ${target.label}: ${target.value}`;
      tooltip.style.display = 'block';
      tooltip.style.left = `${event.clientX - rect.left}px`;
      tooltip.style.top = `${event.clientY - rect.top}px`;
    }

    canvas.addEventListener('mousemove', showTooltip);
    canvas.addEventListener('mouseleave', function () {
      tooltip.style.display = 'none';
    });

    updateAnchorVisibility();
    drawChart();
  </script>
</body>

</html>
