<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>背单词</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #1f2937;
      background: #f5f7fb;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .home-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card,
    .panel,
    .entry {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    .stat-card {
      padding: 16px;
    }

    .stat-card p {
      margin: 0 0 8px;
      color: #64748b;
      font-size: 14px;
    }

    .stat-card strong {
      font-size: 30px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
    }

    .panel {
      padding: 18px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    canvas {
      width: 100%;
      height: 300px;
    }

    .entries {
      display: grid;
      gap: 12px;
    }

    .entry {
      display: block;
      padding: 16px;
      text-decoration: none;
      color: inherit;
    }

    .entry:hover {
      border-color: #93c5fd;
    }

    .entry strong {
      display: block;
      margin-bottom: 6px;
      font-size: 18px;
    }

    .entry span {
      color: #64748b;
      font-size: 14px;
    }

    .legend {
      display: flex;
      gap: 14px;
      color: #64748b;
      font-size: 14px;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 6px;
      border-radius: 50%;
    }

    .green {
      background: #22c55e;
    }

    .red {
      background: #ef4444;
    }

    @media (max-width: 860px) {
      .stats,
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="topbar">
      <h1>背单词主页</h1>
      <a class="home-link" href="/Home">前往主页</a>
    </div>

    <section class="stats">
      <div class="stat-card">
        <p>已浏览单词</p>
        <strong>{{ stats.unique_count }}</strong>
      </div>
      <div class="stat-card">
        <p>分类次数</p>
        <strong>{{ stats.event_count }}</strong>
      </div>
      <div class="stat-card">
        <p>会的单词</p>
        <strong>{{ stats.known_count }}</strong>
      </div>
      <div class="stat-card">
        <p>不会的单词</p>
        <strong>{{ stats.unknown_count }}</strong>
      </div>
    </section>

    <section class="layout">
      <div class="panel">
        <h2>最近筛选记录</h2>
        <div class="legend">
          <span><i class="dot green"></i>会</span>
          <span><i class="dot red"></i>不会</span>
        </div>
        <canvas id="dailyChart" width="760" height="300"></canvas>
      </div>

      <div class="entries">
        <a class="entry" href="/word/sort">
          <strong>筛选文章单词</strong>
          <span>从托福文章或自定义文本里筛出新词。</span>
        </a>
        <a class="entry" href="/word/list">
          <strong>单词表</strong>
          <span>查看已经标记为会和不会的单词。</span>
        </a>
        <a class="entry" href="/word/review">
          <strong>背单词</strong>
          <span>复习流程后面接着做。</span>
        </a>
      </div>
    </section>
  </main>

  <script>
    const dailyData = {{ stats.daily | tojson }};
    const canvas = document.getElementById('dailyChart');
    const ctx = canvas.getContext('2d');

    function drawChart() {
      const width = canvas.width;
      const height = canvas.height;
      const padding = 34;
      const chartHeight = height - padding * 2;
      const chartWidth = width - padding * 2;
      const maxValue = Math.max(1, ...dailyData.map(item => item.known + item.unknown));
      const groupWidth = chartWidth / dailyData.length;
      const barWidth = Math.min(18, groupWidth / 3);

      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = '#dbe3ef';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padding, padding);
      ctx.lineTo(padding, height - padding);
      ctx.lineTo(width - padding, height - padding);
      ctx.stroke();

      dailyData.forEach((item, index) => {
        const x = padding + index * groupWidth + groupWidth / 2;
        const knownHeight = item.known / maxValue * chartHeight;
        const unknownHeight = item.unknown / maxValue * chartHeight;
        const baseY = height - padding;

        ctx.fillStyle = '#22c55e';
        ctx.fillRect(x - barWidth - 2, baseY - knownHeight, barWidth, knownHeight);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(x + 2, baseY - unknownHeight, barWidth, unknownHeight);

        ctx.fillStyle = '#64748b';
        ctx.font = '11px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(item.date.slice(5), x, height - 10);
      });
    }

    drawChart();
  </script>
</body>

</html>
